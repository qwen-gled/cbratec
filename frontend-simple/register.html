<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Criar Conta</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="full_name">Nome Completo:</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Senha:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repita a senha">
                </div>
                <div class="form-group">
                    <label for="date_of_birth">Data de Nascimento:</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" required>
                </div>
                <div class="form-group">
                    <label for="document_number">CPF ou Passaporte:</label>
                    <input type="text" id="document_number" name="document_number" required placeholder="CPF ou número do passaporte">
                </div>
                <div class="form-group">
                    <label for="country">País:</label>
                    <input type="text" id="country" name="country" required placeholder="Seu país">
                </div>
                <div class="form-group">
                    <label for="institution">Instituição:</label>
                    <input type="text" id="institution" name="institution" required placeholder="Sua instituição">
                </div>
                <div class="form-group">
                    <label for="category">Categoria:</label>
                    <select id="category" name="category" required>
                        <option value="">Selecione...</option>
                        <option value="professional">Profissional</option>
                        <option value="student">Estudante</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>
            <p class="switch-link">Já tem conta? <a href="index.html">Faça login</a></p>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
